spring:
  config:
    name: sutone-agent-bok-app
  profiles:
    active: docker-local

# RocketMQ 默认配置（所有环境共用，profile 可按需覆盖）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: ai-writing-producer-group
    send-message-timeout: 10000
    retry-times-when-send-failed: 2

# AI 写作 MQ 自定义配置
ai-writing:
  mq:
    topic: ai-writing-task
    consumer-group: ai-writing-worker-group
    consume-thread-min: 2
    consume-thread-max: 4
    max-reconsume-times: 3
  outbox:
    publish-delay-ms: 2000
    batch-size: 100
    max-retry-count: 5
    sending-timeout-minutes: 5
  recovery:
    running-timeout-minutes: 5
    max-retry-count: 3
  # AI 写作意图守卫（灰度开关）
  guard:
    # 规则预筛开关（先规则后模型）
    rule-enabled: true
    # 模型二判开关（需先注册轻量分类 Agent）
    model-enabled: true
    # 轻量意图分类 Agent ID（与单 Agent 写作 300005 隔离）
    classifier-agent-id: 300006
    # submit 侧是否强制要求 precheckToken：灰度期 false（缺失放行+打点），全量验证后切 true
    enforce: false

# API Key 加密密钥（多租户模型配置）
# 生产环境必须通过环境变量覆盖，默认值仅用于本地开发
crypto:
  api-key:
    secret: ${CRYPTO_API_KEY_SECRET:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
