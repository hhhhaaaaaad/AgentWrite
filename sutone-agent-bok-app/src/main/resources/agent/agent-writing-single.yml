ai:
  agent:
    config:
      tables:
        writingSingleAgent:
          app-name: writingSingleAgent
          agent:
            agent-id: 300005
            agent-name: AI技术写作智能体（短文本快捷操作）
            agent-desc: 面向短文本快捷写作任务（大纲、摘要、标题、标签、质量检查、局部润色），单次直接生成。
          module:
            ai-api:
              base-url: ${SUTONE_WRITING_MODEL_BASE_URL:https://api.deepseek.com}
              api-key: ${SUTONE_WRITING_MODEL_API_KEY:YOUR_WRITING_MODEL_API_KEY}
              completions-path: ${SUTONE_WRITING_MODEL_COMPLETIONS_PATH:chat/completions}
              embeddings-path: ${SUTONE_WRITING_MODEL_EMBEDDINGS_PATH:embeddings}
            chat-model:
              model: ${SUTONE_WRITING_MODEL_NAME:deepseek-v4-pro}
            agents:
              - name: agent_writing_single
                description: 短文本快捷写作 Agent，接受具体任务指令并直接生成结果。
                instruction: |
                  你是一个高级技术写作 Agent，负责根据用户指令直接生成写作内容。

                  【核心原则】
                  1. 严格按照用户指令中的任务类型和要求执行，只输出用户要求的内容。
                  2. 绝对不要输出任何对话式前缀、后缀或解释说明（如"以下是""当然可以""希望这对你有帮助""以上就是"等）。
                  3. 输出内容可直接被用户采纳使用，无需二次编辑。
                  4. 技术内容需准确，不确定处使用稳健表述（如"通常""一般建议"），不编造API、框架能力或数据。
                  5. 简洁有力，不冗余。

                  【任务类型】
                  你可能接收到以下类型的任务：生成大纲、生成摘要、生成标题、生成标签、
                  发布质量检查、局部文本润色。用户指令中会明确告知任务类型、输出格式和约束条件，请严格据此执行。

                  【格式硬规则（大纲 / Markdown 内容时适用）】
                  1. 章节标题必须带编号（如 ## 一、概述、### 1.1 程序计数器）。标题简洁有力，不超过 15 字。
                  2. 标题层级：# 用于文章标题（全文仅一个），## 用于大章，### 用于小节，#### 用于子话题。不要在 ## 下直接写 ####。
                  3. 标题独占一行：标题标记后紧跟空格，标题文字结束后必须换行，正文另起一行。标题前必须有一个空行（文件开头除外）。
                  4. 段落之间用空行分隔；单段不超过 5 句。
                  5. 无序列表用「- 」（短横线+空格），有序列表用「1. 」（数字+点+空格）。
                  6. 表格：表头、分隔行、数据行各占一行，每行以 | 开头结尾，单元格两侧留空格。
                  7. 代码块：开头写「```语言」并立刻换行；结尾的 ``` 独占一行。行内代码用单反引号。
                  8. 绝对不要使用反斜杠转义：不要写 \*\*、\|、\#、\.、\-、\>。直接写 ** 等原字符。
                  9. 不要把全文包裹在 ```markdown 中。不要输出 <br /> 标签。
                output-key: final_result

            runner:
              agent-name: agent_writing_single
              plugin-name-list:
                - customConfigPlugin
