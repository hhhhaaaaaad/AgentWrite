server:
  port: 8091

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# 数据库配置；启动时配置数据库资源信息
spring:
  data:
    redis:
      host: localhost
      port: 16379
  config:
    import:
#      - classpath:agent/test-agent-02.yml
#      - classpath:agent/test-agent.yml
#       - classpath:agent/only-one-agent.yml
       - classpath:agent/agent-draw-io.yml
       - classpath:agent/agent-ppt.yml
       - classpath:agent/agent-illustration-analysis.yml
       - classpath:agent/agent-writing.yml
       - classpath:agent/agent-writing-chat.yml
       - classpath:agent/agent-writing-single.yml
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:3306/sutone_agent_bok?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  hikari:
    pool-name: Retail_HikariCP
    minimum-idle: 15 #最小空闲连接数量
    idle-timeout: 180000 #空闲连接存活最大时间，默认600000（10分钟）
    maximum-pool-size: 25 #连接池最大连接数，默认是10
    auto-commit: true  #此属性控制从池返回的连接的默认自动提交行为,默认值：true
    max-lifetime: 1800000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000即30分钟
    connection-timeout: 30000 #数据库连接超时时间,默认30秒，即30000
    connection-test-query: SELECT 1
  type: com.zaxxer.hikari.HikariDataSource

# 文件上传配置
upload:
  dir: ./uploads

# MyBatis 配置【如需使用记得打开】
#mybatis:
#  mapper-locations: classpath:/mybatis/mapper/*.xml
#  config-location:  classpath:/mybatis/config/mybatis-config.xml
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 记忆系统 Embedding 配置（独立于 chat 模型，使用硅基流动 SiliconFlow）
memory:
  inject:
    enabled: ${MEMORY_INJECT_ENABLED:true}
  embedding:
    base-url: ${MEMORY_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    api-key: ${MEMORY_EMBEDDING_API_KEY:YOUR_SILICONFLOW_API_KEY}
    model: ${MEMORY_EMBEDDING_MODEL:BAAI/bge-large-zh-v1.5}
    embeddings-path: ${MEMORY_EMBEDDING_PATH:/v1/embeddings}

# 日志
logging:
  level:
    root: info
    com.google.adk.flows.BaseLlmFlow: warn
    cn.sutone.ai.domain.agent.service.ai_writing.AiWritingService: debug
  config: classpath:logback-spring.xml